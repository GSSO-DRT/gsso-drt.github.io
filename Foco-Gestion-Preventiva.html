<style>
:root{
  --turquesa:#0098AA; --naranja:#E96C28; --amarillo:#F4A700; --cobre:#BB5726;

}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--dark);background:#fff;}
header{padding:28px 36px 18px;border-bottom:1px solid var(--border);}
header .kicker{color:var(--turquesa);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;}
.kicker{color:var(--turquesa);font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;}
header h1{margin:6px 0 4px;font-size:26px;}
header .badge{display:inline-block;background:var(--cobre);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:10px;vertical-align:middle;}
header .sub{color:var(--gray);font-size:14px;}
nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:0 36px;display:flex;gap:4px;overflow-x:auto;z-index:50;}
nav button{border:none;background:none;padding:14px 16px;font-size:13.5px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav button.active{color:var(--turquesa);border-bottom-color:var(--turquesa);}
nav button:hover{color:var(--dark);}
main{padding:28px 36px 60px;max-width:1300px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.stats-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.stat-card{background:var(--card);border-radius:10px;padding:14px 16px;flex:1;min-width:150px;text-align:center;}
.stat-card .v{font-size:24px;font-weight:700;}
.stat-card .l{font-size:11.5px;color:var(--gray);margin-top:4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:22px;}
.grid3{display:grid;grid-template-columns:1.4fr 0.8fr 1fr;gap:20px;margin-bottom:22px;}
h3.section-title{font-size:13.5px;margin:0 0 10px;color:var(--dark);}
table.datatable{width:100%;border-collapse:collapse;font-size:12.5px;}
table.datatable th{background:var(--cobre);color:#fff;text-align:left;padding:7px 9px;font-size:11.5px;}
table.datatable td{padding:6px 9px;border-bottom:1px solid var(--border);}
table.datatable tr.clickable{cursor:pointer;}
table.datatable tr.clickable:hover{background:#fafafa;}
.pct{color:var(--naranja);font-weight:700;}

.pattern-card .txt{font-size:13px;line-height:1.4;color:var(--gray);}

.pattern-card button.reveal:hover{opacity:.88;}
.pattern-card button.reveal-rp{background:var(--naranja);}
.alert-box{background:#FFF4EC;border:2px solid var(--cobre);border-radius:8px;padding:12px 14px;margin-top:14px;box-shadow:0 2px 6px rgba(187,87,38,.15);}
.alert-box .alert-lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--cobre);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.alert-box .alert-lbl .ico{background:var(--cobre);color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.alert-box .ttl{font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.alert-box .txt{font-size:12.5px;line-height:1.4;color:var(--dark);}
.alert-box button.reveal{margin-top:8px;background:var(--cobre);color:#fff;border:none;border-radius:14px;padding:5px 12px;font-size:11.5px;cursor:pointer;font-weight:600;}
.detail-box{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;display:none;}
.detail-box.open{display:block;}
.reco{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start;}
.reco .num{background:var(--cobre);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.ytd-band{background:var(--card);border-radius:8px;padding:12px 16px;margin:18px 0;}
.ytd-band .lbl{color:var(--turquesa);font-weight:700;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;}
.ytd-band .txt{font-size:13.5px;margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.bar-row .lbl{width:150px;flex-shrink:0;color:var(--dark);}
.bar-row .track{flex:1;background:#F0F0F0;border-radius:3px;height:16px;position:relative;}
.bar-row .fill{background:var(--turquesa);height:100%;border-radius:3px;}
.bar-row .val{width:40px;text-align:right;font-weight:600;flex-shrink:0;}
.explore-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.explore-filters select, .explore-filters input{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
.explore-filters input[type=text]{flex:1;min-width:220px;}
.count-badge{color:var(--gray);font-size:12.5px;margin-bottom:8px;}
.badge-abierta{color:#fff;background:var(--cobre);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;}
.badge-cerrada{color:#fff;background:var(--turquesa);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;}
.badge-cerradasin{color:var(--gray);background:#EEE;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;}
.footer-note{color:var(--lightgray);font-size:11px;margin-top:30px;border-top:1px solid var(--border);padding-top:12px;}
.scrollbox{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
.scrollbox table.datatable th{position:sticky;top:0;}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}
</style>
</head>

ón"}, {"id": "45072", "fecha": "2026-10-20 09:09", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia  Mtto. Chanc. Primarios y Correas", "empresa": "Berliam SPA", "rf_code": "01", "rf_nombre": "Energía Eléctrica", "causa": "Condición", "descripcion": "Se detecta libro bloqueo en chancado óxido , sin firma por parte del supervisor (pica rocas)", "estatus": "Cerrado", "plazo": "Inmediato", "descripcion_cierre": "Se cierra de forma inmediata la desviación"}, {"id": "45081", "fecha": "2026-10-20 12:01", "gerencia": "Gerencia de Planta", "superintendencia": "Superintendencia Área Seca", "empresa": "CODELCO", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Condición", "descripcion": "En cola CV-206 lado derecho mesa 1, se observa que falta la protección lateral de correa. Se debe reinstalar.", "estatus": "Cerrado", "plazo": "1 Mes (N2)", "descripcion_cierre": "Se instala protección faltante en el sector solicitado."}, {"id": "45087", "fecha": "2026-10-20 15:18", "gerencia": "Gerencia de Planta", "superintendencia": "Superintendencia Área Húmeda", "empresa": "CODELCO", "rf_code": "22", "rf_nombre": "Falla de Estructuras", "causa": "Condición", "descripcion": "Grating caído en sector zócalo central bco 4 celda 10", "estatus": "Abierto", "plazo": "2 Semanas (N2)", "descripcion_cierre": ""}, {"id": "45088", "fecha": "2026-10-20 15:36", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "10", "rf_nombre": "Vehículos", "causa": "Acción", "descripcion": "Se evidencia que ART de traslado de personal identifica el RF10; sin embargo, registra los números de control del 1 al 4, sin identificar las siglas correspondientes a cada control crítico (CCP1, CCP2, CCP3, CCP4). Además, omite la incorporación del CCM1, requerido para el RF10, tanto en la sección del supervisor como en la del trabajador.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Fecha de ejecución: 20 de octubre de 2026 Empresa: SGS SIGA DHSIGA Contrato: N.º 4600028755 División: Codelco Radomiro Tomic Motivo: Capacitación ejecutada como acción correctiva para el cierre de hallazgos asociados a la elaboración y aplicación del ART. Descripción de la actividad Con fecha 20 de octubre de 2026, se desarrolló una capacitación dirigida a los trabajadores del servicio SGS SIGA DHSIGA, como parte de las acciones correctivas destinadas al cierre de hallazgos relacionados con la correcta elaboración y aplicación de la herramienta de gestión y control de riesgos en terreno, Análisis de Riesgos de la Tarea (ART). La actividad tuvo como finalidad reforzar el cumplimiento del estándar de ejecución y control de riesgos en terreno, estableciendo la obligación de efectuar un análisis consciente, específico y coherente con las condiciones reales de cada tarea, evitando registros genéricos o incompletos que no permitan identificar adecuadamente los peligros y sus controles. Durante la capacitación se enfatizó la correcta identificación de los Riesgos de Fatalidad (RF) aplicables, particularmente el Riesgo de Fatalidad N.º 10 (RF10), asociado a las actividades de conducción y transporte, debiendo individualizar los controles críticos correspondientes: CCP: Control Crítico Preventivo. CCM: Control Crítico Mitigador. Se reforzó la obligación de registrar la clasificación, numeración y denominación oficial de cada control crítico aplicable, conforme a los estándares vigentes de Codelco División Radomiro Tomic, asegurando su trazabilidad con los peligros identificados, las actividades desarrolladas y las medidas de control requeridas. Asimismo, se instruyó que los controles críticos deberán verificarse en terreno antes del inicio de las actividades y que cualquier incumplimiento deberá corregirse previamente a su ejecución. La capacitación se enmarca en las disposiciones del D.S. N.º 44, Ley N.º 16.744, D.S. N.º 132 y los requisitos aplicables del Sistema de Gestión de Seguridad y Salud Ocupacional de Codelco División Radomiro Tomic. Esta actividad constituye una acción correctiva ejecutada el 20 de octubre de 2026 para contribuir al cierre del hallazgo identificado, quedando su cierre efectivo sujeto a la verificación de los registros de capacitación, la comprensión de los trabajadores y la correcta aplicación del ART en terreno."}, {"id": "45089", "fecha": "2026-10-20 15:39", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "No se evidencia registro de difusión del Procedimiento de Trabajo Seguro de Conducción y Transporte de Personal, que permita acreditar que el personal involucrado fue instruido respecto de su contenido.", "estatus": "Cerrado", "plazo": "2 Semanas (N2)", "descripcion_cierre": "Se realiza la difusión del Procedimiento de Conducción y Transporte de Personal, código TR-PTS-CON-002, emitido el 03 de agosto de 2026, dirigida a los conductores del servicio de Transportes Rodríguez, con el propósito de fortalecer el conocimiento, comprensión y aplicación de las disposiciones de seguridad establecidas para las actividades de conducción y traslado de trabajadores. Durante la actividad se refuerzan las responsabilidades de los conductores respecto de la conducción segura, inspección preoperacional de vehículos, identificación de peligros, evaluación de riesgos, cumplimiento de las normas de tránsito y aplicación de los controles preventivos asociados a los Riesgos de Fatalidad correspondientes. Asimismo, se enfatiza la importancia de cumplir las medidas de seguridad establecidas en el procedimiento, prevenir accidentes de tránsito y proteger la vida e integridad física de los trabajadores transportados. Esta difusión se desarrolla en concordancia con las obligaciones de información de riesgos y gestión preventiva establecidas en el Decreto Supremo N.º 44, Ley N.º 16.744, Ley N.º 18.290 y Decreto Supremo N.º 132, además de los requisitos de seguridad vial y control de riesgos aplicables de Codelco División Radomiro Tomic. La actividad deberá quedar respaldada mediante un registro de difusión y toma de conocimiento firmado por los participantes, identificando el procedimiento, su código, revisión vigente y responsable de la difusión, como evidencia documental de cumplimiento. Se establece que todos los conductores deberán conocer y aplicar las disposiciones del procedimiento durante la ejecución de sus funciones, contribuyendo a una operación de transporte segura y controlada."}, {"id": "45090", "fecha": "2026-10-20 15:44", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Condición", "descripcion": "Se evidencia que gato hidráulico y las barras metálicas de accionamiento mantienen el código de color rojo, correspondiente al período de abril a junio, sin evidenciar la actualización del código de inspección para los períodos posteriores, lo que da cuenta de la falta de trazabilidad de las inspecciones realizadas durante julio, agosto y septiembre, así como de la inspección correspondiente al período actual, octubre.", "estatus": "Cerrado", "plazo": "2 Semanas (N2)", "descripcion_cierre": "Regularización de evidencia documental – Cierre RDP N.º 45090 Se procede a complementar y regularizar la evidencia documental correspondiente al cierre del RDP N.º 45090, registrado en la plataforma ZYGHT de Codelco División Radomiro Tomic. Se adjunta el documento de respaldo debidamente completado, el cual contiene las firmas de los trabajadores participantes, permitiendo acreditar la ejecución de la actividad y asegurar su trazabilidad. Se deja constancia de que, durante la gestión de cierre anterior, por un error involuntario, se adjuntó únicamente el formato del registro, omitiéndose el documento original con las firmas correspondientes. Mediante la presente gestión se subsana dicha omisión, incorporando la evidencia correcta para su revisión, validación y cierre definitivo del RDP N.º 45090 en la plataforma ZYGHT."}, {"id": "45096", "fecha": "2026-10-20 18:39", "gerencia": "Gerencia de Planta", "superintendencia": "Superintendencia Área Seca", "empresa": "tranymec", "rf_code": "06", "rf_nombre": "Incendio", "causa": "Condición", "descripcion": "Se observa extintor fuera de estandar, le falta la boquilla a la manguera", "estatus": "Cerrado", "plazo": "2 Semanas (N2)", "descripcion_cierre": "Se reliza el retiro del extintor, se le aplica señaletica de no uso y se cambia por otro extintor."}, {"id": "45104", "fecha": "2026-10-21 03:51", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia  Mtto. Chanc. Primarios y Correas", "empresa": "Berliam SPA", "rf_code": "01", "rf_nombre": "Energía Eléctrica", "causa": "Condición", "descripcion": "En trabajos de soldadura se detectó que al caer material incandescente en cable eléctrico, este sufre quemadura.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se inatala manta inifuga y se retira materiales inflamable del area"}, {"id": "45105", "fecha": "2026-10-21 03:57", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia Confiabilidad Planta", "empresa": "contitech chile s.a.", "rf_code": "01", "rf_nombre": "Energía Eléctrica", "causa": "Condición", "descripcion": "En trabajos de cambio de cinta CV114 se evidencia generador KVA500 utilizándose para el tiro de correa con enrollador con Aldaba sin candado por estructura con instalación errónea (ausencia de orificio para candado)", "estatus": "Cerrado", "plazo": "2 Semanas (N2)", "descripcion_cierre": "Se genera cierre de hallazgo"}, {"id": "45106", "fecha": "2026-10-21 08:10", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 1, No se logra evidenciar el cumplimiento de los siguientes puntos: 1- Documento interno de la empresa con formalización de ADC del contrato y el representante designado. 2. Línea Base de los RF Divisional aplicables al contrato, trazable con MIPER.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se presenta evidencia documental de la inducción realizada al Dueño del Riesgo de Fatalidad N.º 10 (RF10) de la empresa Transportes Rodríguez, responsable de la gestión de riesgos asociados a las actividades de conducción y transporte de personal del servicio SGS SIGA DHSIGA, contrato N.º 4600028755, en Codelco División Radomiro Tomic. La documentación adjunta tiene por finalidad acreditar la inducción del responsable designado, Sr. Juan Tabilo Godoy, respecto de sus funciones y responsabilidades en la gestión, implementación, seguimiento y verificación de los Controles Críticos Preventivos (CCP) y Controles Críticos Mitigadores (CCM) aplicables al RF10. Asimismo, se establece la trazabilidad con su designación formal, informada mediante Libro de Obras Digital (LOD) con fecha 03 de agosto de 2026, fortaleciendo el respaldo documental del cumplimiento de los requisitos de gestión de riesgos de fatalidad aplicables en Codelco División Radomiro Tomic. En virtud de lo anterior, se solicita la revisión y validación de los antecedentes adjuntos para dar cumplimiento y gestionar el cierre del RDP N.º 45106, registrado en la plataforma ZYGHT de Codelco División Radomiro Tomic."}, {"id": "45107", "fecha": "2026-10-21 08:12", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 2, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. El programa de SST, formalizado por representantes de la Empresa, toma de conocimiento ADC e IPR Codelco, validación por parte de su Organismo Administrador de la Ley 16.744, respaldo de envío a SERNAGEOMIN. 2. Cronograma de actividades, de acuerdo a los 07 elementos SIGO. 3. Registro de LOD de envío a ADC Codelco.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se adjuntan los antecedentes y evidencias documentales necesarios para acreditar la subsanación del hallazgo detectado durante la auditoría realizada el 20 de octubre de 2026 a la empresa Transportes Rodríguez, correspondiente al servicio de transporte de personal de SGS SIGA DHSIGA en Codelco División Radomiro Tomic. La documentación presentada considera los siguientes respaldos: 1. Programa de Seguridad y Salud en el Trabajo (SST): Documento formalizado por el representante de Transportes Rodríguez, que incorpora la toma de conocimiento de la empresa mandante SGS SIGA DHSIGA y de su Inspector de Prevención de Riesgos (IPR). 2. Cronograma de actividades preventivas: Programación de actividades del Programa SST, estructurada conforme a los siete (7) elementos del Sistema de Gestión de Seguridad y Salud Ocupacional (SIGO) de Codelco, permitiendo establecer la planificación y seguimiento de las acciones preventivas comprometidas. 3. Registro de Libro de Obras Digital (LOD): Se adjunta el registro firmado entre Transportes Rodríguez y SGS SIGA DHSIGA, como evidencia de la comunicación formal y trazabilidad documental de los antecedentes presentados. La documentación se entrega con el propósito de acreditar la formalización, comunicación y planificación del Programa SST, en concordancia con las obligaciones de gestión preventiva establecidas en el D.S. N.º 44, la Ley N.º 16.744 y los requisitos aplicables del SIGO de Codelco División Radomiro Tomic. En virtud de los antecedentes adjuntos, se solicita la revisión y validación de las evidencias presentadas para gestionar el cierre del hallazgo en la plataforma ZYGHT, dejando constancia de las acciones de regularización documental implementadas."}, {"id": "45108", "fecha": "2026-10-21 08:15", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 3, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Control operacional Preventivo (COP) de todas las actividades críticas a desarrollar. 2. Identificación de la totalidad de RF aplicables a la actividad.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del levantamiento de hallazgos detectados durante la auditoría del 20 de octubre de 2026, se adjuntan antecedentes documentales que respaldan la incorporación de las actividades del subcontrato de transporte de personal de Transportes Rodríguez E.I.R.L. al sistema de Control Operativo Preventivo (COP) del servicio SGS-SIGA-DHSIGA, contrato N.º 4600028755, desarrollado en dependencias de Codelco División Radomiro Tomic. Se deja constancia de que, a partir del 26 de octubre de 2026, se incorpora el reporte de las actividades del subcontrato mediante el formulario COP, cuya información es remitida por el Jefe de Construcción y/o Operaciones de SGS-SIGA-DHSIGA, de lunes a jueves, antes de las 09:00 horas. Este mecanismo permite registrar las actividades de transporte de personal, identificar los recorridos y áreas de operación, mantener la trazabilidad de la información y facilitar el seguimiento preventivo de las actividades ejecutadas. La evidencia adjunta corresponde a los antecedentes de implementación y envío del COP desde el 26 de octubre de 2026, como respaldo de la gestión desarrollada para subsanar la desviación identificada. En consecuencia, se solicita la revisión y validación de la evidencia presentada para el levantamiento del RP N.º 45108 y, de verificarse su conformidad con los requisitos establecidos por el equipo auditor, proceder con su cierre formal en plataforma ZYGHT."}, {"id": "45109", "fecha": "2026-10-21 08:17", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Item 4, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Mapa de procesos según alcance del contrato. 2. Matriz de identificación y evaluación de riesgos actualizada de la totalidad de actividades del contrato, y trazable con los Mapas de Procesos, según evaluación SIGO-P-006 y Mapas de higiene. 3. Incorporación de identificación de riesgos y medidas preventivas/correctivas de aprendizajes Corporativos, DRT y propios. 4. Difusión al personal del Mapa de proceso y MIPER.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta los antecedentes documentales correspondientes a los aprendizajes derivados de las observaciones identificadas, los cuales han sido incorporados a la Matriz de Identificación de Peligros y Evaluación de Riesgos (IPER) del servicio. Se deja constancia de que los aprendizajes incorporados se encuentran debidamente identificados y destacados en color amarillo dentro de la Matriz IPER, con la finalidad de facilitar su ubicación, revisión y verificación por parte del equipo auditor. Esta actualización documental tiene por objetivo fortalecer la identificación de peligros, la evaluación de riesgos y la aplicación de medidas de control preventivo, considerando las actividades de transporte de personal desarrolladas por el subcontrato en dependencias de Codelco División Radomiro Tomic. Asimismo, la documentación presentada permite establecer la trazabilidad entre los aprendizajes identificados y su incorporación a la gestión preventiva del servicio, contribuyendo al mejoramiento continuo de los controles operacionales y a la prevención de eventos no deseados. En virtud de lo expuesto, se solicita formalmente la revisión y validación de los antecedentes adjuntos, considerando la incorporación de los aprendizajes y su identificación en color amarillo dentro de la Matriz IPER, con el propósito de acreditar las acciones implementadas y proceder, previa verificación de su conformidad, al cierre definitivo del hallazgo correspondiente en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con la mejora continua, la gestión de riesgos y el cumplimiento de los requisitos de Seguridad y Salud Ocupacional establecidos por Codelco División Radomiro Tomic y SGS-SIGA-DHSIGA."}, {"id": "45110", "fecha": "2026-10-21 08:33", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 6, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Respaldo de trabajos que implican riesgos inherentes altos. (Verificación ítems 4). 2. Evidencia LOD, de envió de los trabajos que implican riesgos inherentes altos. (Matriz IPER) 3. Respaldo de los métodos seguros para realizar tareas críticas. (Procedimientos de trabajo y otros métodos) 4. Evidencia LOD, de envío de los métodos seguros para realizar tareas críticas.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se realiza entrega de antecedentes y evidencias documentales con el propósito de acreditar el cumplimiento oportuno y gestionar el cierre del hallazgo detectado durante la auditoría efectuada el 20 de octubre de 2026 a la empresa Transportes Rodríguez, correspondiente al servicio de transporte de personal en Codelco División Radomiro Tomic. La documentación presentada permite establecer la trazabilidad entre la identificación de actividades con riesgos inherentes altos, la evaluación de dichos riesgos, los métodos seguros de ejecución y su comunicación formal a la empresa mandante SGS SIGA DHSIGA. Se adjuntan los siguientes respaldos: 1. Identificación de trabajos con riesgos inherentes altos: Documentación que identifica las actividades críticas del servicio de transporte de personal y los riesgos inherentes asociados a su ejecución. 2. Evidencia de comunicación mediante Libro de Obras Digital (LOD): Registro que respalda el envío formal a la empresa mandante de la Matriz de Identificación de Peligros y Evaluación de Riesgos (IPER), incluyendo las actividades que presentan riesgos inherentes altos. 3. Procedimientos de Trabajo Seguro: Documentación que establece los métodos de ejecución, responsabilidades, medidas preventivas y controles operacionales aplicables a las tareas críticas identificadas. Los antecedentes presentados tienen por finalidad demostrar la identificación, evaluación, control y comunicación formal de los riesgos inherentes altos, asegurando la trazabilidad documental entre la Matriz IPER, los procedimientos de trabajo seguro y los registros de comunicación con la empresa mandante. Esta gestión se desarrolla en concordancia con las disposiciones del D.S. N.º 44, Ley N.º 16.744, D.S. N.º 132, Reglamento de Seguridad Minera, y los requisitos aplicables del Sistema de Gestión de Seguridad y Salud Ocupacional de Codelco División Radomiro Tomic. En virtud de los antecedentes entregados, se solicita la revisión y validación de las evidencias documentales adjuntas, con el propósito de acreditar la subsanación del hallazgo y gestionar su cierre en tiempo y forma mediante la plataforma ZYGHT, manteniendo la trazabilidad de las acciones implementadas y el cumplimiento de los requisitos de seguridad establecidos para el servicio."}, {"id": "45111", "fecha": "2026-10-21 08:38", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 7, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Mapa de proceso trazable con MIPER 2. Actualización anual de MIPER. 3. Actualización de MIPR en caso de aprendizajes y/o eventos. 4. Notificación de MIPER a ADC Codelco vía LOD.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta los antecedentes documentales que respaldan el análisis y la incorporación de los aprendizajes correspondientes en la Matriz de Identificación de Peligros y Evaluación de Riesgos (MIPER), aplicable a las actividades de transporte de personal desarrolladas para SGS-SIGA-DHSIGA, contrato N.º 4600028755, en Codelco División Radomiro Tomic. Se deja expresa constancia de que los aprendizajes fueron analizados e incorporados a la MIPER, encontrándose debidamente identificados y destacados en color amarillo, con el propósito de facilitar su ubicación, revisión y verificación por parte del equipo auditor. Esta actualización permite fortalecer la trazabilidad entre los aprendizajes identificados, los peligros asociados a las actividades operacionales y las medidas de control preventivo establecidas, contribuyendo al mejoramiento continuo de la gestión de riesgos del servicio. En virtud de lo expuesto, y considerando las evidencias documentales adjuntas, se solicita formalmente la revisión y validación de los antecedentes presentados, con el propósito de acreditar el cumplimiento del requisito observado y proceder al cierre definitivo del hallazgo correspondiente en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con la incorporación sistemática de aprendizajes, la actualización de sus herramientas preventivas y el cumplimiento de los estándares de Seguridad y Salud Ocupacional establecidos por Codelco División Radomiro Tomic y SGS-SIGA-DHSIGA."}, {"id": "45112", "fecha": "2026-10-21 08:44", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 8, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. MIPER trazable con declaración de Riesgo de Fatalidad. 2. Para riesgos de fatalidad se consideran los controles de Fatalidad. 3. Los controles considerados para los riesgos de fatalidad son de Alta Jerarquía.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría del 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. informa que se ha desarrollado un nuevo análisis técnico de los Riesgos de Fatalidad (RF) asociados a las actividades de transporte de personal, contrastándolos con los peligros, riesgos y medidas de control establecidos en la Matriz de Identificación de Peligros y Evaluación de Riesgos (MIPER). Como resultado de esta revisión, se efectuó una reevaluación de la clasificación de los controles existentes, identificando y diferenciando aquellos que, por su naturaleza y mecanismo de actuación, corresponden a controles de ingeniería, respecto de los controles administrativos y demás medidas preventivas. Este proceso tiene por finalidad fortalecer la coherencia técnica entre los Riesgos de Fatalidad aplicables, los controles establecidos y su clasificación conforme a la jerarquía de controles, asegurando una adecuada trazabilidad documental y una representación consistente de las medidas de prevención implementadas en el servicio. Se deja constancia de que la revisión considera las actividades desarrolladas por Transportes Rodríguez E.I.R.L. como subcontratista de SGS-SIGA-DHSIGA, bajo el contrato N.º 4600028755, en Codelco División Radomiro Tomic. En virtud de lo expuesto, se presenta la MIPER actualizada como evidencia del análisis efectuado, solicitando al equipo auditor su revisión y validación, con el propósito de acreditar la correcta clasificación de los controles y proceder, una vez verificada su conformidad, al cierre del hallazgo correspondiente en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con el mejoramiento continuo de la gestión preventiva, la aplicación efectiva de la jerarquía de controles y el cumplimiento de los estándares de Seguridad y Salud Ocupacional establecidos por Codelco División Radomiro Tomic y SGS-SIGA-DHSIGA."}, {"id": "45113", "fecha": "2026-10-21 08:48", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 9, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Metodología formalizada, indicando la identificación y evaluación del marco regulatorio legal y actualización periódica, de acuerdo con el alcance de sus contrato. 2. Registro de identificación y evaluación marco regulatorio, de acuerdo con metodología. 3. Plan de cierre de brechas, formalizado. 4. Registro formalizado de monitoreo periódico del plan de brechas, a lo menos registro de 3 monitoreos posteriores a la auditoría y según Metodología.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría RESSO V.10, realizada el 20 de octubre de 2026, se desarrolla la entrega de antecedentes documentales asociados al hallazgo N.º 45113, registrado en plataforma ZYGHT. La presente entrega tiene por finalidad acreditar el avance en la regularización del cumplimiento del marco normativo legal aplicable al servicio de transporte de personal, mediante los siguientes antecedentes: Metodología formalizada de identificación y evaluación del marco regulatorio legal: documento que establece los criterios para identificar, evaluar, controlar y actualizar periódicamente los requisitos legales aplicables, considerando el alcance y las actividades propias del contrato. Registro de identificación y evaluación del marco regulatorio: documentación que permite establecer la trazabilidad de las obligaciones legales aplicables al servicio, su evaluación de cumplimiento y la identificación de eventuales desviaciones que requieren acciones correctivas. Plan de Cierre de Brechas formalizado: documento que establece las acciones necesarias para regularizar los incumplimientos identificados, incorporando responsables, actividades, plazos de ejecución y medios de verificación, conforme a los requisitos legales y contractuales aplicables. Registro formalizado de monitoreo periódico del Plan de Cierre de Brechas: respecto de este requisito, se deja constancia de que los tres monitoreos posteriores a la auditoría aún se encuentran pendientes de ejecución, dado que están considerados dentro de la programación y seguimiento del Plan de Cierre de Brechas del servicio de transporte de personal. En consecuencia, los registros correspondientes serán generados conforme a las fechas establecidas en dicho plan y a la metodología formalizada, permitiendo acreditar progresivamente el seguimiento, control y verificación de las acciones correctivas comprometidas. Estado del levantamiento Se presenta evidencia documental correspondiente a los requisitos N.º 1, 2 y 3, quedando el requisito N.º 4 en proceso de implementación, sujeto a la ejecución y registro de los tres monitoreos posteriores a la auditoría. Conclusión: Mediante la presente entrega, Transportes Rodríguez E.I.R.L. informa el avance del levantamiento documental del hallazgo N.º 45113, manteniendo la trazabilidad de los antecedentes presentados y de las actividades pendientes. Se solicita la revisión de la documentación adjunta y el reconocimiento del avance registrado, manteniendo el hallazgo en proceso de cierre hasta completar los monitoreos comprometidos y obtener la validación correspondiente por parte de las instancias responsables de Codelco División Radomiro Tomic."}, {"id": "45114", "fecha": "2026-10-21 09:03", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia  Mtto. CH&MM", "empresa": "Berliam SPA", "rf_code": "11", "rf_nombre": "Espacios Confinados", "causa": "Condición", "descripcion": "RF11 - ESPACIOS CONFINADOS CCP1 - SISTEMA DE INGRESO CONTROLADO Y VIGILADO CCP2 - EVALUACION Y MONITOREO DE ATMOSFERA Se levanta RPN1 durante caminata de inspeccion en terreno, en cambio y ajuste de placas cola Cv112, por evidenciar actividad en espacios confinados sin CCP/CCM aplicables. Los hallazgos son los siguientes: -Sin procedimiento de trabajo especifico, sin su respectiva difusion y registro de trabajadores, ni evaluaciones correspondientes. -Sin permiso de espacios confinados. -Sin medidor de gases.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se solicita a supervisor LUIS BIGORENA regularizar hallazgo, quien inmediatamente gestiona la impresio, difusion y evaluacion de procedimiento especifico, tambien gestiona la confeccion de permiso de trabajos confinado en conjunto a personal involucrado y por ultimo consigue con personal de bodega el medidor de oxigeno correspondinte. Posteriormente se realiza reinstruccion al personal involucrado y se retoman actividades."}, {"id": "45121", "fecha": "2026-10-21 13:07", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 11, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Respaldos del 10 la dotación total, considerando la totalidad de cargos de la empresa: - Descriptor de cargo. - IRL formalizada, y sus anexos. - Evaluación de IRL. - Certificados de competencias. 2. IRL de acuerdo con Mapa de procesos y MIPER, considera riesgos del área y Mapas de Higiene del área. 3. Certificaciones por organismos competentes, de las competencias de acuerdo con bases contractuales y riesgos y agentes de exposición, Organismos validados por la Corporación. 4. En caso de presentar brechas deben evidenciar el cierra al 100%. 5. Las Certificaciones deben ser vigentes.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y regularización de las observaciones identificadas durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta antecedentes documentales destinados a acreditar la trazabilidad entre las actividades desarrolladas, la identificación de peligros, la información de riesgos laborales entregada a sus trabajadores y las competencias requeridas para la ejecución segura del servicio de transporte de personal. 1. Trazabilidad entre el Mapa de Procesos, la MIPER y el Descriptor de Cargo Se presenta el Mapa de Procesos SIGO-F-011, versión 03, junto con la Matriz de Identificación de Peligros y Evaluación de Riesgos SIGO-F-006, versión 07, y el Descriptor de Cargo correspondiente al personal conductor. Estos documentos permiten establecer una relación técnica entre las actividades operacionales, las tareas asignadas, los peligros identificados, las medidas preventivas y las responsabilidades propias del cargo. Esta vinculación responde a las obligaciones de gestión preventiva establecidas en el Decreto Supremo N.º 44 y al deber de protección del empleador previsto en el artículo 184 del Código del Trabajo. 2. Información de Riesgos Laborales (IRL) y evaluación de comprensión Se adjuntan los documentos de Información de Riesgos Laborales, revisión 06, correspondientes al personal conductor, junto con los antecedentes de formalización y evaluación disponibles. La información entregada contempla las condiciones de trabajo, los peligros asociados a la conducción, los controles preventivos, las medidas de protección y los procedimientos de actuación aplicables al servicio. Esta documentación se vincula con el artículo 15 del Decreto Supremo N.º 44, que establece la obligación de informar a las personas trabajadoras sobre los riesgos de sus labores y las medidas de prevención correspondientes. 3. Certificación de competencias laborales Se presentan los certificados de competencias laborales de los conductores Carlos Omar Núñez Lavado y Juan Segundo Chaile Liendro, emitidos por JES & DOR Ltda., centro que declara acreditación conforme al sistema establecido por la Ley N.º 20.267. Los certificados respaldan la aprobación de evaluaciones teóricas y prácticas para el perfil de conductor de transporte de personal en faena minera, específicamente en vehículo Mercedes-Benz Sprinter 516 CDI. Ambos documentos registran vigencia hasta el 6 de noviembre de 2027. La acreditación presentada constituye un antecedente de competencia técnica que debe complementarse con la verificación de licencias habilitantes, autorizaciones operacionales y aceptación del organismo certificador conforme a las exigencias contractuales y divisionales aplicables. 4. Verificación de brechas y cumplimiento documental Los antecedentes adjuntos permiten respaldar el proceso de revisión documental de las competencias y obligaciones preventivas del personal conductor. Para acreditar el cierre integral de las observaciones, se considera necesario verificar la cobertura de la dotación y de los cargos comprendidos en el alcance de auditoría, la correspondencia con los mapas de riesgos higiénicos aplicables, la aceptación de las certificaciones y el tratamiento documentado de cualquier brecha pendiente. 5. Solicitud de revisión y cierre En virtud de lo expuesto, Transportes Rodríguez E.I.R.L. solicita al equipo auditor revisar y validar los antecedentes presentados, considerando la relación documental entre el Mapa de Procesos, la MIPER, los descriptores de cargo, las IRL formalizadas, sus evaluaciones y los certificados de competencias laborales vigentes. Una vez verificada la conformidad de los cinco requisitos observados y acreditado el cierre de las brechas que correspondan, se solicita proceder al levantamiento y cierre formal del hallazgo en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con la gestión preventiva, la competencia de sus trabajadores y el cumplimiento de las disposiciones legales y contractuales aplicables al servicio N.º 4600028755."}, {"id": "45122", "fecha": "2026-10-21 13:10", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 12, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Capacitación formal de los dueños de los RF designados por la empresa contratista, con toma de conocimiento al 100% a la línea de supervisión. (difusión y evaluación)", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría RESSO V.10, realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. desarrolla la entrega de evidencia documental destinada a subsanar el hallazgo N.º 45122, registrado en plataforma ZYGHT. La presente entrega tiene por finalidad acreditar el cumplimiento del requisito establecido por el equipo auditor, correspondiente a: 1. Capacitación formal de los Dueños de los Riesgos de Fatalidad (RF) designados por la empresa contratista, con toma de conocimiento del 100? la línea de supervisión, mediante difusión y evaluación. Para dar cumplimiento a este requerimiento, se presentan antecedentes documentales destinados a respaldar la capacitación formal de los Dueños de los Riesgos de Fatalidad designados por la empresa, considerando los riesgos aplicables a las actividades del servicio de transporte de personal y los controles establecidos por Codelco División Radomiro Tomic. Asimismo, la documentación presentada tiene por objeto acreditar la difusión de los contenidos y la evaluación de conocimientos de la totalidad de la línea de supervisión involucrada, asegurando la trazabilidad entre las responsabilidades asignadas, los Riesgos de Fatalidad aplicables y los controles críticos que deben ser conocidos, implementados y verificados durante el desarrollo de las actividades operacionales. Los antecedentes de respaldo considerados para acreditar el cumplimiento corresponden a: Designación formal de los Dueños de los Riesgos de Fatalidad aplicables al contrato. Registros de capacitación de los Dueños de Riesgos de Fatalidad. Registros de difusión y toma de conocimiento de la línea de supervisión. Evaluaciones de conocimientos relacionadas con los Riesgos de Fatalidad y sus respectivos controles críticos. Solicitud de cierre del hallazgo Mediante la presente entrega, Transportes Rodríguez E.I.R.L. solicita formalmente la revisión y validación de las evidencias documentales asociadas al hallazgo N.º 45122, con el propósito de acreditar el cumplimiento de las exigencias establecidas en el ítem N.º 12 del Anexo N.º 3 RESSO V.10. Lo anterior contribuye al fortalecimiento de las competencias preventivas de la línea de supervisión, asegurando el conocimiento y la correcta aplicación de los controles asociados a los Riesgos de Fatalidad identificados para el servicio de transporte de personal en Codelco División Radomiro Tomic."}, {"id": "45123", "fecha": "2026-10-21 13:13", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 13, No se logra evidenciar el cumplimiento de los siguientes puntos: ¿La Política Corporativa y la Carta de Valores se dio a conocer a todos los trabajadores(as) de la empresa contratista y subcontratista? ¿Se cuenta con evidencia de ello? 1. Difusión de la totalidad de los trabajadores contratistas y subcontratistas", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría RESSO V.10, efectuada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. realiza la entrega de evidencia documental destinada a acreditar el cumplimiento del requisito de difusión de la Política Corporativa y Carta de Valores de Codelco. Para estos efectos, se adjuntan los antecedentes de difusión y toma de conocimiento, destinados a demostrar que los contenidos establecidos en ambos documentos han sido comunicados a la totalidad de los trabajadores de la empresa contratista y subcontratista que corresponda, conforme al alcance del servicio. Los registros presentados permiten verificar la identificación de los trabajadores participantes, las actividades de difusión realizadas y sus respectivas evidencias de toma de conocimiento, con el propósito de acreditar una cobertura del 100? la dotación aplicable. Mediante la presente entrega, se solicita al equipo auditor la revisión y validación de los antecedentes adjuntos y, una vez verificado el cumplimiento íntegro del requisito observado, proceder con el cierre formal del hallazgo correspondiente en plataforma ZYGHT. Lo anterior tiene por finalidad mantener la trazabilidad documental del cumplimiento de las exigencias establecidas en el Anexo N.º 3 RESSO V.10, fortaleciendo el conocimiento y la aplicación de los principios, valores y lineamientos corporativos de Codelco División Radomiro Tomic."}, {"id": "45124", "fecha": "2026-10-21 13:17", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 15: No se evidencia registro de difusión del Procedimiento de Trabajo Seguro de Conducción y Transporte de Personal, que permita acreditar que el personal involucrado fue instruido respecto de su contenido.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría RESSO V.10, efectuada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. realiza la entrega de evidencia documental destinada a subsanar la desviación relacionada con la falta de respaldo de difusión del Procedimiento de Trabajo Seguro de Conducción y Transporte de Personal. Para dar cumplimiento al requerimiento formulado por el equipo auditor, se adjuntan antecedentes correspondientes a la difusión e instrucción del procedimiento señalado, con el propósito de acreditar que el personal involucrado en las actividades de conducción y transporte de personal ha recibido información respecto de su contenido, los riesgos asociados a sus funciones, las medidas preventivas y los controles operacionales aplicables. La documentación presentada está destinada a respaldar: Difusión formal del procedimiento: registros de instrucción del Procedimiento de Trabajo Seguro de Conducción y Transporte de Personal, considerando su identificación y versión vigente. Toma de conocimiento del personal: registros individuales que permitan acreditar la participación y recepción de la información por parte de los trabajadores involucrados. Cobertura del personal: verificación de que la difusión comprende al 100? los trabajadores a quienes resulta aplicable el procedimiento. Trazabilidad documental: correspondencia entre el procedimiento difundido, la nómina de trabajadores involucrados y los respectivos registros de instrucción y toma de conocimiento. Solicitud de cierre del hallazgo En consecuencia, una vez verificada la conformidad de los registros de difusión, instrucción y toma de conocimiento del personal involucrado, se solicita proceder con el cierre formal del hallazgo correspondiente en plataforma ZYGHT. Lo anterior permite fortalecer la trazabilidad del proceso de capacitación e instrucción operacional, asegurando que los trabajadores conozcan los métodos de trabajo seguro y los controles preventivos establecidos para el desarrollo de las actividades de conducción y transporte de personal en Codelco División Radomiro Tomic."}, {"id": "45126", "fecha": "2026-10-21 13:22", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia Confiabilidad Planta", "empresa": "contitech chile s.a.", "rf_code": "03", "rf_nombre": "Izaje", "causa": "Condición", "descripcion": "Previo a realización de maniobras de izaje se detecta que no se encuentra check list de eslingas", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Sw realiza check list correspondiente y se reanuda maniobra"}, {"id": "45127", "fecha": "2026-10-21 13:24", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 19, No se logra evidenciar el cumplimiento de los siguientes puntos: 1.- Registro de Diálogos de Desempeño (DdD) de la empresa. 2.- Respaldo de Confirmación de procesos (CdP) de la totalidad de tareas IMPORTANTES e INTOLERABLES registro Zyght, trazables con el PAM. 3.- Respaldo de Confirmación del Rol (CdR) de la totalidad de la línea de supervisión registro Zyght, trazables con el PAM.", "estatus": "Abierto", "plazo": "1 Semana (N1)", "descripcion_cierre": ""}, {"id": "45128", "fecha": "2026-10-21 13:27", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 21, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Registro GES, Formalizado por EE.CC. Y validado por Organismo Administrador del Seguro. 2. Informes Cuantitativos y/o cualitativos, de cada agente evaluado. 3. Programa de trabajo con Organismo Administrador del Seguro. 4. Respaldo de cumplimiento de Programa con Organismo Administrador del Seguro.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento de hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta antecedentes documentales asociados a la gestión de exposición a agentes higiénicos de los trabajadores que desarrollan actividades de transporte de personal en Codelco División Radomiro Tomic. Como parte de la evidencia, se adjuntan los Reportes GES de marzo y junio de 2026, correspondientes al servicio de transporte de personal, en los cuales se identifica el Grupo de Exposición Similar (GES) denominado CONDUCTORES, asociado al contrato N.º 4600028755, y se reconoce a la Asociación Chilena de Seguridad (ACHS) como Organismo Administrador del Seguro de la Ley N.º 16.744. Asimismo, se incorpora el Mapa de Riesgo de Sílice de División Radomiro Tomic, como antecedente técnico de referencia para la identificación de sectores con exposición a sílice, considerando las áreas de interacción y circulación relacionadas con las actividades del servicio. Complementariamente, se presenta el registro de difusión y capacitación sobre riesgos higiénicos, mediante el cual se respalda la entrega de información preventiva respecto de la exposición a agentes ocupacionales, las medidas de control y las responsabilidades asociadas a la protección de los trabajadores. Los antecedentes presentados permiten evidenciar avances en la identificación del grupo de exposición, la recopilación de información higiénica y la difusión de medidas preventivas aplicables al personal de Transportes Rodríguez E.I.R.L. Sin perjuicio de lo anterior, la acreditación integral de los requisitos observados requiere verificar la existencia y vigencia de los informes de evaluación cualitativa y/o cuantitativa correspondientes a los agentes aplicables, así como el programa de trabajo establecido con ACHS y los registros de cumplimiento de las actividades comprometidas. En virtud de lo expuesto, se solicita al equipo auditor revisar y validar las evidencias documentales adjuntas, considerando su correspondencia con los requisitos observados y el alcance operacional del subcontrato. Asimismo, se solicita identificar los antecedentes complementarios que resulten necesarios para acreditar el cumplimiento integral y proceder al cierre formal del hallazgo en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con el cumplimiento de los requisitos de Salud Ocupacional, la coordinación con su organismo administrador y el fortalecimiento de las medidas de prevención y control de los agentes higiénicos asociados a sus actividades."}, {"id": "45129", "fecha": "2026-10-21 13:30", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 23, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Difusión a la totalidad del Personal de Mapas de Riesgo de Higiene Industrial DRT, actualizados. 2. Verificación de terreno de Mapas de higiene y conocimiento de interpretación por parte de los trabajadores.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta evidencia documental correspondiente a la difusión de los riesgos higiénicos ocupacionales asociados a las actividades de transporte de personal, desarrolladas en dependencias de Codelco División Radomiro Tomic. La actividad de difusión tiene como finalidad informar a los trabajadores sobre los agentes de riesgo higiénico presentes en los ambientes laborales, sus posibles efectos sobre la salud, las condiciones de exposición y las medidas preventivas y de protección que deben aplicar durante la ejecución de sus funciones. Asimismo, se refuerza el conocimiento de los riesgos asociados a las áreas de circulación e interacción del servicio, considerando los antecedentes disponibles en los mapas de riesgos higiénicos de la División, la Matriz de Identificación de Peligros y Evaluación de Riesgos (MIPER) y la Información de Riesgos Laborales (IRL) correspondiente al cargo de conductor. Esta actividad se desarrolla en concordancia con las obligaciones de información y capacitación establecidas en el Decreto Supremo N.º 44, especialmente su artículo 15, y con las disposiciones aplicables del Decreto Supremo N.º 594 sobre condiciones sanitarias y ambientales básicas en los lugares de trabajo. La documentación presentada busca acreditar la comunicación de los riesgos higiénicos al personal, fortaleciendo la trazabilidad entre los peligros identificados, las medidas de control establecidas y el conocimiento de los trabajadores respecto de su aplicación. En virtud de lo expuesto, se solicita formalmente al equipo auditor revisar y validar los registros de difusión adjuntos como evidencia del cumplimiento de las obligaciones de información preventiva, con el propósito de subsanar la observación identificada y proceder, previa verificación de su conformidad, al cierre del hallazgo correspondiente en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con la protección de la salud de sus trabajadores, el cumplimiento de los requisitos legales vigentes y el fortalecimiento continuo de la gestión preventiva del servicio N.º 4600028755."}, {"id": "45130", "fecha": "2026-10-21 13:33", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 24, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Programa de Baja Experiencia Laboral. 2. Registro de trabajadores/as Tutor y BEL, de los últimos 6 meses. 3. Registro de Evaluaciones de trabajadores/as BEL, de los últimos 6 meses.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En atención al hallazgo identificado durante la auditoría RESSO V.10 del 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. realiza la entrega del Programa de Baja Experiencia Laboral (BEL), elaborado para dar cumplimiento al requerimiento formulado por el equipo auditor. Se deja expresa constancia de que la empresa no cuenta con trabajadores clasificados como BEL, debido a su política interna de contratación, orientada a disponer exclusivamente de conductores con experiencia, competencias acreditadas y conocimiento de las condiciones operacionales, rutas y riesgos asociados al transporte de personal en Codelco División Radomiro Tomic. Esta exigencia responde a la responsabilidad que implica el traslado seguro de trabajadores y al control del Riesgo de Fatalidad N.º 10 – Pérdida de Control de Vehículos. En consecuencia, no se dispone de registros de trabajadores BEL, tutores ni evaluaciones correspondientes a los últimos seis meses, debido a que no se ha contado con personal bajo dicha clasificación. Por lo anterior, se adjunta únicamente el Programa BEL formalizado, solicitando al equipo auditor considerar la justificación técnica presentada, evaluar la condición de «No Aplica» para los registros señalados y, previa validación de los antecedentes, proceder con el cierre del hallazgo en plataforma ZYGHT. Se establece que, ante una futura incorporación de trabajadores que cumplan los criterios BEL definidos por Codelco, se aplicará el programa y se generarán los registros correspondientes."}, {"id": "45132", "fecha": "2026-10-21 13:36", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 25, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Plan de emergencia formalizado de EE.CC., de acuerdo con el alcance del contrato. 2. Trazable con Reglamento de Emergencias DRT. 3. Trazable con planes locales de emergencias de acuerdo con las áreas de interacción. 4. Registro de la capacitación y evaluación al personal.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta los antecedentes documentales correspondientes al hallazgo N.º 45132, relacionado con la formalización, trazabilidad, difusión y capacitación del Plan de Respuesta ante Emergencias aplicable al servicio de transporte de personal desarrollado para SGS-SIGA-DHSIGA, bajo el contrato N.º 4600028755, en Codelco División Radomiro Tomic. La documentación presentada tiene por finalidad acreditar el cumplimiento de los siguientes requisitos observados durante el proceso de auditoría: 1. Plan de Emergencias formalizado de la empresa contratista (EE.CC.): Se presenta como antecedente de respaldo el Plan de Respuesta ante Emergencias de Transportes Rodríguez E.I.R.L., elaborado de acuerdo con el alcance de las actividades de transporte de personal, considerando los escenarios de emergencia asociados a la operación, las responsabilidades del personal y los procedimientos de actuación y comunicación correspondientes. 2. Trazabilidad con el Reglamento de Emergencias de DRT: Se incorpora como requisito de verificación la concordancia del plan de la empresa con las disposiciones establecidas en el Reglamento de Emergencias de Codelco División Radomiro Tomic, particularmente respecto de los mecanismos de notificación, activación de emergencias, coordinación y respuesta ante eventos operacionales. 3. Registros de capacitación y evaluación del personal: Se presentan como parte de los antecedentes requeridos los registros de capacitación y difusión del Plan de Respuesta ante Emergencias, junto con las evaluaciones correspondientes, destinados a acreditar que los trabajadores conocen los procedimientos de actuación, comunicación, evacuación y protección de pasajeros ante situaciones de emergencia. La entrega de estos antecedentes busca proporcionar evidencia objetiva, verificable y trazable, que permita evaluar la conformidad del sistema de preparación y respuesta ante emergencias del subcontrato con los requisitos establecidos por Codelco División Radomiro Tomic y SGS-SIGA-DHSIGA. Asimismo, Transportes Rodríguez E.I.R.L. reafirma su compromiso con el cumplimiento de la normativa legal vigente, el fortalecimiento de las competencias de sus trabajadores y la aplicación de medidas preventivas destinadas a proteger la integridad de las personas durante la ejecución del servicio. En virtud de lo expuesto, se solicita formalmente la revisión y validación de los antecedentes documentales presentados y, una vez verificado el cumplimiento de los cuatro requisitos observados, proceder con el cierre del hallazgo N.º 45132 en plataforma ZYGHT, manteniendo la correspondiente trazabilidad documental del proceso."}, {"id": "45133", "fecha": "2026-10-21 13:39", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia Confiabilidad Planta", "empresa": "contitech chile s.a.", "rf_code": "03", "rf_nombre": "Izaje", "causa": "Condición", "descripcion": "Previo a realización de maniobras de izaje se detecta que no se cuenta con check list de eslinga", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se realiza check list correspondiente y se reanuda actividad"}, {"id": "45134", "fecha": "2026-10-21 13:40", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 26, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Programa de simulacros relacionado a emergencias que afectan a su servicio, con responsables y fechas. 2. Respaldo de cumplimiento de simulacros (informe). 3. Plan de acción de hallazgos de simulacros. 4. Respaldos cierre de plan de acción.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de las observaciones identificadas durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta los antecedentes documentales que respaldan su incorporación a la planificación y desarrollo del Plan de Simulacro de Emergencias establecido por la empresa mandante SGS-SIGA-DHSIGA, correspondiente al contrato N.º 4600028755, ejecutado en dependencias de Codelco División Radomiro Tomic. Se deja expresa constancia de que, dada su condición de empresa subcontratista, Transportes Rodríguez E.I.R.L. se acogió al Plan de Simulacro de Emergencias desarrollado por SGS-SIGA-DHSIGA, adoptando los lineamientos, procedimientos de coordinación y mecanismos de respuesta definidos por la empresa mandante, en aquellas materias aplicables al alcance de sus actividades de transporte de personal."}, {"id": "45135", "fecha": "2026-10-21 13:48", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 30, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Difusión de aprendizajes Corporativos. 2. Difusión aprendizajes DRT. 3. Registro formalizado de Aplicabilidad de aprendizajes corporativos y DRT, del periodo. 4. Evidencia de cumplimientos de aplicabilidad (extracto MIPER/procedimiento) 5. En caso de aplicar Planes de acción fecha y responsables. 6. Evidencia de cumplimiento de planes de acción de acuerdo con plazos establecidos.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta antecedentes documentales destinados a acreditar la gestión, difusión, análisis de aplicabilidad e incorporación de los aprendizajes corporativos de Codelco y divisionales de Radomiro Tomic, correspondientes al período evaluado. La documentación presentada tiene como finalidad demostrar la trazabilidad de los aprendizajes recibidos y su vinculación con los riesgos, actividades y controles preventivos aplicables al servicio de transporte de personal desarrollado como subcontratista de SGS-SIGA-DHSIGA, bajo el contrato N.º 4600028755. Para dar respuesta a los requisitos observados, se consideran los siguientes antecedentes: 1. Difusión de aprendizajes corporativos: Se adjuntan antecedentes de difusión de los aprendizajes emitidos a nivel corporativo por Codelco, con el propósito de reforzar el conocimiento de los trabajadores respecto de eventos relevantes, causas identificadas y medidas preventivas orientadas a evitar su recurrencia. 2. Difusión de aprendizajes divisionales DRT: Se presentan registros de difusión de los aprendizajes correspondientes a Codelco División Radomiro Tomic, considerando aquellos relacionados con las actividades operacionales, condiciones de trabajo y riesgos asociados al transporte de personal. 3. Registro formalizado de aplicabilidad: Se incorpora el análisis de aplicabilidad de los aprendizajes corporativos y divisionales correspondientes al período auditado, considerando su relación con las actividades desarrolladas por Transportes Rodríguez E.I.R.L. y los riesgos identificados en el servicio. Este registro permite distinguir los aprendizajes aplicables de aquellos que no guardan relación con el alcance operacional del subcontrato, dejando constancia de su justificación técnica. 4. Evidencia de cumplimiento e incorporación a la MIPER: Como respaldo de la gestión preventiva, se presentan los antecedentes de actualización de la Matriz de Identificación de Peligros y Evaluación de Riesgos (MIPER), en la cual los aprendizajes incorporados se encuentran debidamente identificados y destacados en color amarillo, facilitando su ubicación, revisión y verificación por parte del equipo auditor. Esta medida permite establecer una relación documental entre los aprendizajes analizados, los peligros asociados, los riesgos evaluados y las medidas de control correspondientes. Cuando resulte aplicable, dicha trazabilidad debe extenderse a los procedimientos de trabajo asociados. 5. Planes de acción, responsables y fechas de cumplimiento: Para aquellos aprendizajes cuya aplicación requiera implementar medidas adicionales, se considera su incorporación a planes de acción que permitan identificar las actividades comprometidas, los responsables de ejecución, las fechas establecidas y los respectivos respaldos de cumplimiento. En aquellos casos donde no se requieran acciones adicionales, deberá mantenerse la justificación correspondiente en el registro de aplicabilidad. La gestión descrita se enmarca en las obligaciones preventivas establecidas por la Ley N.º 16.744, el artículo 184 del Código del Trabajo y el Decreto Supremo N.º 44, particularmente respecto de la identificación de peligros, evaluación de riesgos, información a los trabajadores y revisión de las medidas preventivas. Asimismo, permite fortalecer el proceso de mejora continua mediante la incorporación de aprendizajes derivados de eventos y experiencias operacionales, favoreciendo la prevención de incidentes y la actualización de los controles aplicables al servicio. En virtud de lo expuesto, Transportes Rodríguez E.I.R.L. solicita formalmente al equipo auditor la revisión y validación de las evidencias documentales presentadas, considerando la difusión de aprendizajes corporativos y divisionales, su análisis formal de aplicabilidad, la incorporación de los aprendizajes pertinentes a la MIPER y la identificación de los planes de acción que correspondan. Una vez verificado el cumplimiento integral de los cinco requisitos observados, se solicita proceder con el levantamiento y cierre definitivo del hallazgo correspondiente en plataforma ZYGHT, manteniendo la trazabilidad documental de las acciones desarrolladas. Transportes Rodríguez E.I.R.L. reafirma su compromiso con la mejora continua, la gestión preventiva y el cumplimiento de los estándares de Seguridad y Salud Ocupacional establecidos por Codelco División Radomiro Tomic y SGS-SIGA-DHSIGA."}, {"id": "45136", "fecha": "2026-10-21 14:07", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 33,: No fue posible realizar la verificación en terreno ni establecer la trazabilidad correspondiente, debido a que no se evidenció el reporte COP.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En el marco del proceso de regularización y levantamiento de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta evidencia documental que respalda el inicio de la declaración de sus actividades de transporte de personal mediante la plataforma establecida por Codelco División Radomiro Tomic. Se deja constancia de que, a partir del 26 de octubre de 2026, se comienza a efectuar el ingreso y reporte de información correspondiente a los trabajos de transporte de personal desarrollados al interior de la División, en el contexto del servicio prestado como subcontratista de SGS-SIGA-DHSIGA, contrato N.º 4600028755. Esta medida tiene como finalidad fortalecer la trazabilidad de las actividades ejecutadas, permitiendo identificar y mantener un registro de los trabajos programados, recorridos operacionales y actividades asociadas al traslado de trabajadores dentro de las instalaciones divisionales, conforme a los mecanismos de declaración y control establecidos por la empresa mandante y Codelco División Radomiro Tomic. Asimismo, la incorporación de estas actividades al sistema de reporte divisional constituye una acción de regularización orientada a mejorar el control operacional preventivo, la disponibilidad de información y el seguimiento de las actividades realizadas por el subcontrato. En virtud de lo expuesto, se solicita al equipo auditor revisar y validar los antecedentes adjuntos, considerando la implementación de este mecanismo de declaración a contar del 26 de octubre de 2026, con el propósito de acreditar las acciones correctivas adoptadas y determinar la procedencia del levantamiento y cierre del hallazgo correspondiente en plataforma ZYGHT. Transportes Rodríguez E.I.R.L. reafirma su compromiso con el cumplimiento de los requisitos operacionales y preventivos establecidos por Codelco División Radomiro Tomic y SGS-SIGA-DHSIGA, promoviendo una gestión documentada, verificable y trazable de las actividades de transporte de personal."}, {"id": "45137", "fecha": "2026-10-21 14:11", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Ítem 36, No se logra evidenciar el cumplimiento de los siguientes puntos: 1. Respaldos de capacitación de: - ADC EE.CC. - IPR EE.CC. - Línea de supervisión - Representante de los trabajadores en Comités Paritarios Empresa o Faena.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "en el marco del proceso de levantamiento y cierre de los hallazgos identificados durante la auditoría realizada el 20 de octubre de 2026, Transportes Rodríguez E.I.R.L. presenta como evidencia documental los certificados de asistencia y capacitación correspondientes al Asesor en Prevención de Riesgos y al Administrador de Contrato, relacionados con su participación en la capacitación sobre la metodología de investigación de incidentes ICAM (Incident Cause Analysis Method). La entrega de estos antecedentes tiene por finalidad acreditar la formación de ambos profesionales en una metodología estructurada de investigación de incidentes, orientada a la identificación de causas inmediatas, factores contribuyentes, deficiencias organizacionales y oportunidades de mejora en los sistemas de gestión preventiva. Esta capacitación constituye un respaldo para el fortalecimiento de las competencias del personal responsable de la gestión de Seguridad y Salud Ocupacional, especialmente respecto de la investigación de incidentes, identificación de causas y formulación de acciones correctivas destinadas a prevenir su recurrencia. Asimismo, los certificados presentados permiten respaldar documentalmente la participación de los profesionales señalados en la actividad formativa, contribuyendo a la trazabilidad de las competencias asociadas al servicio de transporte de personal desarrollado para SGS-SIGA-DHSIGA, bajo el contrato N.º 4600028755, en Codelco División Radomi function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function statusBadge(s){
  if(s==="Abierta") return `<span class="badge-abierta">Abierta</span>`;
  if(s==="Cerrada") return `<span class="badge-cerrada">Cerrada con AC</span>`;
  if(s==="Cerrada Sin AC") return `<span class="badge-cerradasin">Cerrada sin AC</span>`;
  return esc(s);
}
function statusBadgeRp(s){
  if(s==="Abierto" || s==="Abierto fuera de plazo") return `<span class="badge-abierta">${esc(s)}</span>`;
  if(s==="Cerrado fuera de plazo") return `<span class="badge-cerradasin">${esc(s)}</span>`;
  return `<span class="badge-cerrada">${esc(s)}</span>`;
}

function renderDetailTable(rows){
  if(!rows.length) return `<div class="count-badge">Sin registros.</div>`;
  let html = `<div class="count-badge">${rows.length} fila(s) — ${new Set(rows.map(r=>r.id)).size} TV única(s)</div>`;
  html += `<div class="scrollbox"><table class="datatable"><thead><tr>
    <th>ID TV</th><th>ID AC</th><th>Fecha</th><th>Empresa</th><th>Superintendencia</th><th>RF</th><th>Descripción</th><th>Causa</th><th>Tipo Energía</th><th>Urgencia</th><th>Estatus TV</th><th>Estatus AC</th>
  </tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr>
      <td><b>${esc(r.id)}</b></td><td>${esc(r.idac)}</td><td>${esc(r.fecha)}</td><td>${esc(r.empresa)}</td>
      <td>${esc((r.superintendencia||'').replace(/^Superintendencia\s*/,'').replace(/^Dirección de Proyectos\s*/,'Dir. Proy. '))}</td>
      <td>${esc(r.rf_code)} ${esc(r.rf_nombre)}</td>
      <td style="max-width:280px;">${esc(r.descripcion)}</td>
      <td>${esc(r.causa||r.categoria_causa||'')}</td>
      <td>${esc(r.tipo_energia)}</td><td>${esc(r.urgencia)}</td>
      <td>${statusBadge(r.estatus_tv)}</td><td>${esc(r.estatus_ac)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

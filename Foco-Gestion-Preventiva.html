<style>
:root{

*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--dark);background:#fff;}
header{padding:28px 36px 18px;border-bottom:1px solid var(--border);}
header .kicker{color:var(--turquesa);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;}
.kicker{color:var(--turquesa);font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;}
header h1{margin:6px 0 4px;font-size:26px;}
header .badge{display:inline-block;background:var(--cobre);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:10px;vertical-align:middle;}
header .sub{color:var(--gray);font-size:14px;}
nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:0 36px;display:flex;gap:4px;overflow-x:auto;z-index:50;}
nav button{border:none;background:none;padding:14px 16px;font-size:13.5px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav button.active{color:var(--turquesa);border-bottom-color:var(--turquesa);}
nav button:hover{color:var(--dark);}
main{padding:28px 36px 60px;max-width:1300px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.stats-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.stat-card{background:var(--card);border-radius:10px;padding:14px 16px;flex:1;min-width:150px;text-align:center;}
.stat-card .v{font-size:24px;font-weight:700;}
.stat-card .l{font-size:11.5px;color:var(--gray);margin-top:4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:22px;}
.grid3{display:grid;grid-template-columns:1.4fr 0.8fr 1fr;gap:20px;margin-bottom:22px;}
h3.section-title{font-size:13.5px;margin:0 0 10px;color:var(--dark);}
table.datatable{width:100%;border-collapse:collapse;font-size:12.5px;}
table.datatable th{background:var(--cobre);color:#fff;text-align:left;padding:7px 9px;font-size:11.5px;}
table.datatable td{padding:6px 9px;border-bottom:1px solid var(--border);}

table.datatable tr.clickable:hover{background:#fafafa;}
.pct{color:var(--naranja);font-weight:700;}
.pattern-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.pattern-card .ttl{font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.pattern-card .txt{font-size:13px;line-height:1.4;color:var(--gray);}
.pattern-card button.reveal{margin-top:0;background:var(--turquesa);color:#fff;border:none;border-radius:14px;padding:5px 12px;font-size:11.5px;cursor:pointer;font-weight:600;}
.pattern-card button.reveal:hover{opacity:.88;}
.pattern-card button.reveal-rp{background:var(--naranja);}
.alert-box{background:#FFF4EC;border:2px solid var(--cobre);border-radius:8px;padding:12px 14px;margin-top:14px;box-shadow:0 2px 6px rgba(187,87,38,.15);}
.alert-box .alert-lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--cobre);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.alert-box .alert-lbl .ico{background:var(--cobre);color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.alert-box .ttl{font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.alert-box .txt{font-size:12.5px;line-height:1.4;color:var(--dark);}
.alert-box button.reveal{margin-top:8px;background:var(--cobre);color:#fff;border:none;border-radius:14px;padding:5px 12px;font-size:11.5px;cursor:pointer;font-weight:600;}
.detail-box{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;display:none;}
.detail-box.open{display:block;}
.reco{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start;}
.reco .num{background:var(--cobre);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.ytd-band{background:var(--card);border-radius:8px;padding:12px 16px;margin:18px 0;}
.ytd-band .lbl{color:var(--turquesa);font-weight:700;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;}
.ytd-band .txt{font-size:13.5px;margin-top:4px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.bar-row .lbl{width:150px;flex-shrink:0;color:var(--dark);}
.bar-row .track{flex:1;background:#F0F0F0;border-radius:3px;height:16px;position:relative;}
.bar-row .fill{background:var(--turquesa);height:100%;border-radius:3px;}
.bar-row .val{width:40px;text-align:right;font-weight:600;flex-shrink:0;}
.explore-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.explore-filters select, .explore-filters input{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
.explore-filters input[type=text]{flex:1;min-width:220px;}
.count-badge{color:var(--gray);font-size:12.5px;margin-bottom:8px;}
.badge-abierta{color:#fff;background:var(--cobre);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;}
.badge-cerrada{color:#fff;background:var(--turquesa);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;}
.badge-cerradasin{color:var(--gray);background:#EEE;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600;}
.footer-note{color:var(--lightgray);font-size:11px;margin-top:30px;border-top:1px solid var(--border);padding-top:12px;}
.scrollbox{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
.scrollbox table.datatable th{position:sticky;top:0;}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}
</style>
</head>

": "2026-11-03 15:14", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "27", "rf_nombre": "Atropello", "causa": "Condición", "descripcion": "Auditoría RESSO final, al revisar los reportes N1 del período asociados al RF27, se identifican las siguientes desviaciones reiteradas: • Segregación deficiente en áreas de operación, con interacción entre personas y equipos • Falta de comunicación bidireccional efectiva entre personal y operadores • Deficiencias en la delimitación y señalización de pasos peatonales • Planes de tránsito desactualizados o no concordantes con la distribución del área Las medidas correctivas administrativas no han evitado su repetición, por lo que se solicita implementar controles de mayor jerarquía.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "1.- Se designa por nota interna N° 16 a los responsables del control de la señalética de tránsito. Se establece que los 2 primeros días de cada turno se realizará trazabilidad de señalética con plan de tránsito. 2.- Se designa mediante nota interna N° 15 los responsables de la generación y actualización de los planes de tránsito. 3.- Se adjunta difusión y evaluación de instructivo de radios de comunicación al personal aplicable en obra. 4.- Se adjunta reporte de asistencia diaria donde se verifica que el personal designado en las notas internas N° 15 y 16 se encuentran vigente en obra. 5.- Se adjunta plan de tránsito actualizado según lo solicitado"}, {"id": "45852", "fecha": "2026-11-03 15:18", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "03", "rf_nombre": "Izaje", "causa": "Condición", "descripcion": "Auditoría RESSO final, al revisar los reportes N1 del período asociados al RF03, se identifica reiteración de manipulación directa de cargas suspendidas y exposición a la línea de fuego Las medidas de cierre registradas corresponden a reinstrucciones y difusión de informe flash, de carácter administrativo, sin evitar la reiteración de estas desviaciones. Se solicita evaluar e implementar controles de mayor jerarquía.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "1.- Se adjunta procedimiento, difusión y evaluación de fabricación y montaje de cañería, donde señala el uso del bastón distanciador. 2.- Se realiza plan de acción donde se actualizará procedimiento de izaje, descarga y manipulación de cargas para incluir la implementación y uso de bastón distanciador. además de incluirá check list, difusión y evaluación a personal que aplique para ambos turnos y se realizará un informe de efectividad del uso del bastón. 3.- Se realiza cierre paliativo."}, {"id": "45853", "fecha": "2026-11-03 15:48", "gerencia": "Gerencia de Mina", "superintendencia": "Superintendencia Servicios Mina", "empresa": "icv", "rf_code": "25", "rf_nombre": "Equipos Mineros", "causa": "Condición", "descripcion": "En cruce de CAEX ICV, se advierte poca visibilidad para los vehículos livianos en sector de detención (señal Pare), ante la circulación de equipos mayores provenientes de ripios transitorios. Se solicita hacer la rebaja del pretil para mejorar la visual.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se realiza reparación de pretil y mejora de visual. Además se realiza cambio de circuito, recuperando rotonda normal de tránsito, post trabajos con Codelco."}, {"id": "45859", "fecha": "2026-11-03 18:26", "gerencia": "Gerencia de Planta", "superintendencia": "Superintendencia Área Seca", "empresa": "CODELCO", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Condición", "descripcion": "En Tripper BM-201 se debe volver a afianzar y habilitar la piola del pull cord lado derecho (zona de los bogguies).", "estatus": "Abierto", "plazo": "3 Semanas (N2)", "descripcion_cierre": ""}, {"id": "45860", "fecha": "2026-11-03 18:31", "gerencia": "Gerencia de Planta", "superintendencia": "Superintendencia Área Seca", "empresa": "CODELCO", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Condición", "descripcion": "En mesa 112 lado izquierdo de la Correa CV-205 la palanca de la caja de pull cord se encuentra quebrada. Se debe cambiar", "estatus": "Abierto", "plazo": "3 Semanas (N2)", "descripcion_cierre": ""}, {"id": "45864", "fecha": "2026-11-03 21:39", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia  Mtto. CH&MM", "empresa": "Berliam SPA", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Condición", "descripcion": "Se levanta RPN2 durante caminata de inspección en terreno, en trabajos de cambio de motor Cv201, por evidenciar cadenas cortantes con placas de identificación sin código de serie.", "estatus": "Abierto", "plazo": "2 Semanas (N2)", "descripcion_cierre": ""}, {"id": "45866", "fecha": "2026-11-03 23:32", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia  Mtto. Chanc. Primarios y Correas", "empresa": "Berliam SPA", "rf_code": "11", "rf_nombre": "Espacios Confinados", "causa": "Condición", "descripcion": "En caminata de seguridad se detecta permiso espacio confinado sin firma por parte supervisor , solamente contaba con firma de LÍDER , de acuerdo al procedimiento de Codelco indica que debe firmar supervisor de actividad , además permiso incompleto en medición de gases", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se le ata condición de inmediato"}, {"id": "45868", "fecha": "2026-11-04 08:01", "gerencia": "Gerencia de Mina", "superintendencia": "Superintendencia Servicios Mina", "empresa": "CODELCO", "rf_code": "25", "rf_nombre": "Equipos Mineros", "causa": "Condición", "descripcion": "Se encuentra caída libre fase 38 este sobre pala 215", "estatus": "Cerrado", "plazo": "Inmediato", "descripcion_cierre": "Se realiza cierre inmediato"}, {"id": "45869", "fecha": "2026-11-04 10:31", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Dirección de Proyectos Botaderos Ripios", "empresa": "fam", "rf_code": "03", "rf_nombre": "Izaje", "causa": "Condición", "descripcion": "Se identifica material de izaje acopiado y con codificación de color no correspondiente al trimestre en curso", "estatus": "Cerrado", "plazo": "2 Semanas (N2)", "descripcion_cierre": "Se codifican herramientas de izaje"}, {"id": "45874", "fecha": "2026-11-04 14:16", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Dirección de Proyectos Botaderos Ripios", "empresa": "CODELCO", "rf_code": "01", "rf_nombre": "Energía Eléctrica", "causa": "Condición", "descripcion": "02.11.26 En inspección a taller de mtto (ex-eimisa) , sector Lascar se verifica jaula protección compresor con candado abierto", "estatus": "Abierto", "plazo": "1 Semana (N1)", "descripcion_cierre": ""}, {"id": "45875", "fecha": "2026-11-04 14:22", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Dirección de Proyectos Botaderos Ripios", "empresa": "CODELCO", "rf_code": "01", "rf_nombre": "Energía Eléctrica", "causa": "Condición", "descripcion": "[02.11.26] En inspección a taller mtto (ex excon) se verifica jaula de compresor abierta con candado expuesto tambien en las mismas condiciones", "estatus": "Abierto", "plazo": "1 Semana (N1)", "descripcion_cierre": ""}, {"id": "45876", "fecha": "2026-11-04 14:57", "gerencia": "Gerencia Mantenimiento Planta", "superintendencia": "Superintendencia  Mtto. Chanc. Primarios y Correas", "empresa": "Berliam SPA", "rf_code": "11", "rf_nombre": "Espacios Confinados", "causa": "Acción", "descripcion": "RF11 – CCP2: Evaluación y monitoreo de atmósfera. Durante la verificación de la actividad de cambio de bloques y placas en Feeder Sulfuro, se evidencia detector de gases con calibración vigente; sin embargo, el personal no disponía en terreno del certificado de calibración correspondiente.", "estatus": "Cerrado fuera de plazo", "plazo": "Inmediato", "descripcion_cierre": "Se gestiona de forma inmediata el envío del certificado del medidor de gas con bodega , se reinicia actividad"}, {"id": "45877", "fecha": "2026-11-04 16:12", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Condición", "descripcion": "Se detecta canastillo con durmientes utilizado para soportar el puente apilador, existiendo tránsito habitual de personal por debajo de la estructura, lo que incrementa el riesgo de caída de objetos y colapso del sistema de soporte.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En relación con el reporte levantado anteriormente y de forma actual por la condición detectada en el soporte de madera, se informa el cierre de la observación, respaldado mediante la implementación de un atril para soporte del Puente Apilador, el cual cuenta con su respectiva memoria de cálculo elaborada por Ingeniería. Cabe señalar que las medidas correctivas fueron implementadas de manera inmediata hace aproximadamente dos meses, manteniéndose vigentes y en condiciones de uso hasta la fecha, lo que puede ser verificado tanto en terreno como mediante los registros fotográficos adjuntos. Como respaldo para el cierre del reporte, se adjunta la siguiente documentación: Registro fotográfico: Evidencia de la instalación del atril y segregación del área involucrada mediante barreras duras. Ficha técnica y memoria de cálculo: Descripción y respaldo técnico del atril para soporte del Puente Apilador, proporcionados por Ingeniería. SDI del atril: Documentación correspondiente al soporte implementado. Finalmente, se destaca que las mejoras implementadas han permanecido en el tiempo, evidenciando la continuidad de las medidas de control adoptadas para corregir la condición inicialmente reportada."}, {"id": "45878", "fecha": "2026-11-04 16:15", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Se identifica a trabajador posicionado sobre la plataforma de un camión pluma, con las barandas de protección lateral abatidas, generando exposición al riesgo de caída a distinto nivel, debido a la ausencia de las barandas.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Se procede al cierre del reporte levantado, respaldado mediante la evidencia del uso correcto de los tres puntos de apoyo y la reinstrucción al personal involucrado, reforzando los métodos seguros de trabajo y las medidas de control correspondientes. Asimismo, se refuerza la importancia de mantener una adecuada planificación de las actividades mediante el RIT, considerando los distintos usos operacionales del camión pluma, tanto para actividades de carga y descarga manual como para maniobras de izaje, asegurando que cada una se ejecute conforme a su procedimiento específico, los riesgos asociados y las medidas de control establecidas."}, {"id": "45879", "fecha": "2026-11-04 16:22", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "02", "rf_nombre": "Trabajo en Altura", "causa": "Condición", "descripcion": "Durante actividad de normalización y torque de estructura estructura TK5 , se detecta trabajador afianzado a horizontal debido a que, por la ubicación, no cuenta con un punto de anclaje dentro de su alcance. Además, no se evidencia permiso trabajo en altura física.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "De acuerdo con lo establecido en el Manual de Trabajo y Montaje de Andamios Layher, se encuentran identificados los puntos de anclaje certificados y autorizados para el uso de sistemas de protección contra caídas. Adicionalmente, en cada frente donde se ejecutan trabajos en altura, se dispone de señalética que identifica los puntos de anclaje autorizados, con el propósito de asegurar su correcta utilización por parte del personal. Cabe destacar que el riesgo de caída de altura se mantiene tanto durante la ejecución de los trabajos como en los desplazamientos sobre las estructuras, por lo que ambas situaciones requieren la aplicación de los controles preventivos asociados al Riesgo Fatal de Caída de Altura (RF), garantizando la protección del trabajador durante toda su exposición al riesgo, por lo tanto, nos guiamos de acuerdo a lo indicado en el manual del proveedor de andamios utilizados."}, {"id": "45880", "fecha": "2026-11-04 16:29", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "27", "rf_nombre": "Atropello", "causa": "Acción", "descripcion": "Se evidencia en terreno que trabajador Tecnasic cruza por la cancha de sal B ubicada en Lixiviación Clorurada, mientras los camiones de sal se encontraban en movimiento. Esta cancha NO es de tránsito peatonal, solo de camiones y maquinaria pesada. Cabe destacar, que la actividad se coordinó y programó de tal manera que cuando ingresaran los camiones de sal, TODOS los equipos Tecnasic deben salir del área, lo cual está plasmado en la gestión de cambio. El trabajador se encontraba a pocos metros del camión en movimiento.", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "Cada ODS cuenta con su respectivo Plan de Tránsito, el cual establece y respalda las rutas de circulación y zonas de tránsito seguro para el personal. Estos planes son difundidos a todos los trabajadores cada vez que se realizan actualizaciones, asegurando el conocimiento y cumplimiento de las medidas de seguridad establecidas en cada área de trabajo. Adicionalmente, TECNASIC mantiene implementado un Programa de Seguridad Conductual, mediante observaciones de conducta orientadas a identificar, corregir y prevenir comportamientos inseguros, promoviendo el autocuidado y el cumplimiento de los estándares de seguridad. Como parte de su proceso de selección, TECNASIC aplica una evaluación psicológica de aversión al riesgo previa a la contratación, con el propósito de identificar aspectos conductuales asociados a la percepción y disposición frente al riesgo, fortaleciendo la gestión preventiva desde el ingreso del trabajador. Asimismo, toda conducta que comprometa la seguridad propia o de terceros está sujeta a las medidas disciplinarias establecidas en el Reglamento Interno de Orden, Higiene y Seguridad (RIOHS), conforme a la gravedad de la falta y los procedimientos internos vigentes."}, {"id": "45881", "fecha": "2026-11-04 16:43", "gerencia": "Gerencia de Proyectos / GPRO", "superintendencia": "Gerencia de Proyectos / GPRO", "empresa": "mutual de seguridad asesorias", "rf_code": "NO_CRITICO", "rf_nombre": "No es riesgo crítico", "causa": "Acción", "descripcion": "Auditoría RESSO final, al revisar los reportes N1 del período 2026, asociados a Procedimientos de Trabajo Seguro y competencias del personal para trabajos en altura física (RF2), se identifican las siguientes desviaciones reiteradas: Procedimientos de Trabajo Seguro: Se identifica la ausencia de procedimientos específicos para la ejecución de las tareas de corte y retiro de perfil interior TK5 (RP N° 34951) y montaje de tubería CAG (RP N° 45287). Competencias del personal para trabajos en altura física: Se identifica personal sin contar con credencial correspondiente que acredite los requisitos exigidos y para el desarrollo de la actividad (RP N° 45288), así como personal que mantiene su licencia/autorización de operación vencida (RP N° 42496).", "estatus": "Cerrado", "plazo": "1 Semana (N1)", "descripcion_cierre": "En relación con los reportes N° 34951, 45287, 45288 y 42496, se informa que estos cuentan con sus respectivos cierres, respaldados mediante la actualización y aplicación de procedimientos de trabajo, junto con las difusiones correspondientes, dando cumplimiento a las acciones correctivas solicitadas. Con el propósito de evitar la ejecución de actividades fuera de los procedimientos establecidos y asegurar la continuidad de las medidas implementadas, TECNASIC mantiene controles preventivos mediante la planificación semanal en el COP, elaboración de ART, charlas de inicio de jornada y planificación de las actividades a través del RIT. Esta última herramienta permite asociar cada tarea a su procedimiento específico, verificando la trazabilidad y coherencia entre lo planificado, los riesgos identificados y lo ejecutado en terreno. Su cumplimiento es verificado mediante confirmaciones de proceso. Respecto de las licencias de conducir, en cumplimiento de los controles asociados al Riesgo Fatal N° 10 (RF10), se realiza una verificación semanal de su vigencia y correspondencia con la clase de licencia requerida para el vehículo o equipo a operar. En cuanto a los trabajos en altura, todo el personal autorizado cuenta con su respectiva credencial y certificación de capacitación, conforme al estándar aplicable. Para los ejecutantes, se exige formación teórica y práctica de 8 horas, mientras que para el personal de supervisión se contempla una capacitación teórica y práctica de 16 horas, asegurando las competencias requeridas para el desarrollo y supervisión de estas actividades. Finalmente, las medidas correctivas implementadas se mantienen bajo seguimiento y verificación permanente, mediante inspecciones internas, confirmaciones de proceso y controles asociados a la planificación de las tareas. Esto permite verificar su cumplimiento en terreno, detectar oportunamente posibles desviaciones y reforzar la aplicación de los procedimientos y estándares de seguridad establecidos, evitando la recurrencia de las condiciones que dieron origen a los reportes."}, function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function statusBadge(s){
  if(s==="Abierta") return `<span class="badge-abierta">Abierta</span>`;
  if(s==="Cerrada") return `<span class="badge-cerrada">Cerrada con AC</span>`;
  if(s==="Cerrada Sin AC") return `<span class="badge-cerradasin">Cerrada sin AC</span>`;
  return esc(s);
}
function statusBadgeRp(s){
  if(s==="Abierto" || s==="Abierto fuera de plazo") return `<span class="badge-abierta">${esc(s)}</span>`;
  if(s==="Cerrado fuera de plazo") return `<span class="badge-cerradasin">${esc(s)}</span>`;
  return `<span class="badge-cerrada">${esc(s)}</span>`;
}

function renderDetailTable(rows){
  if(!rows.length) return `<div class="count-badge">Sin registros.</div>`;
  let html = `<div class="count-badge">${rows.length} fila(s) — ${new Set(rows.map(r=>r.id)).size} TV única(s)</div>`;
  html += `<div class="scrollbox"><table class="datatable"><thead><tr>
    <th>ID TV</th><th>ID AC</th><th>Fecha</th><th>Empresa</th><th>Superintendencia</th><th>RF</th><th>Descripción</th><th>Causa</th><th>Tipo Energía</th><th>Urgencia</th><th>Estatus TV</th><th>Estatus AC</th>
  </tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr>
      <td><b>${esc(r.id)}</b></td><td>${esc(r.idac)}</td><td>${esc(r.fecha)}</td><td>${esc(r.empresa)}</td>
      <td>${esc((r.superintendencia||'').replace(/^Superintendencia\s*/,'').replace(/^Dirección de Proyectos\s*/,'Dir. Proy. '))}</td>
      <td>${esc(r.rf_code)} ${esc(r.rf_nombre)}</td>
      <td style="max-width:280px;">${esc(r.descripcion)}</td>
      <td>${esc(r.causa||r.categoria_causa||'')}</td>
      <td>${esc(r.tipo_energia)}</td><td>${esc(r.urgencia)}</td>
      <td>${statusBadge(r.estatus_tv)}</td><td>${esc(r.estatus_ac)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function renderDetailTableRp(rows){
  if(!rows.length) return `<div class="count-badge">Sin registros.</div>`;
  let html = `<div class="count-badge">${rows.length} RP</div>`;
  html += `<div class="scrollbox"><table class="datatable"><thead><tr>
    <th>ID RP</th><th>Fecha</th><th>Empresa</th><th>Superintendencia</th><th>RF</th><th>Descripción</th><th>Causa</th><th>Estatus</th><th>Descripción Cierre</th>
  </tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr>
      <td><b>${esc(r.id)}</b></td><td>${esc(r.fecha)}</td><td>${esc(r.empresa)}</td>
      <td>${esc((r.superintendencia||'').replace(/^Superintendencia\s*/,'').replace(/^Dirección de Proyectos\s*/,'Dir. Proy. '))}</td>
      <td>${esc(r.rf_code)} ${esc(r.rf_nombre)}</td>
      <td style="max-width:320px;">${esc(r.descripcion)}</td>
      <td>${esc(r.causa)}</td><td>${statusBadgeRp(r.estatus)}</td>
      <td style="max-width:220px;">${esc(r.descripcion_cierre)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function toggleDetail(uid, rows, isRp){
  const box = document.getElementById(uid);
  if(box.classList.contains("open")){ box.classList.remove("open"); box.innerHTML=""; return; }
  box.innerHTML = isRp ? renderDetailTableRp(rows) : renderDetailTable(rows);
  box.classList.add("open");
}

  return items.map(([lbl,val]) => {
    const pct = Math.round(val/max*100);
    return `<div class="bar-row"><div class="lbl">${esc(lbl)}</div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="val">${val}</div></div>`;
  }).join("");
}

function sparklineSvg(values, color){
  const w=340,h=120,pad=8,padTop=16;
  const max = Math.max(...values), min = Math.min(...values,0);
  const range = (max-min)||1;
  const step = (w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = pad + i*step;
    const y = padTop + (h-padTop-pad) - ((v-min)/range)*(h-padTop-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const labels = ["E","F","M","A","M","J","J","A","S","O","N"];
  let dots = pts.map((p,i)=>{
    const prevV = i>0 ? values[i-1] : Infinity;
    const nextV = i<values.length-1 ? values[i+1] : Infinity;
    const isValley = values[i] < prevV && values[i] <= nextV;
    const labelY = isValley ? p[1]+15 : p[1]-8;
    const valTxt = values[i] >= 1000 ? values[i].toLocaleString('en-US').replace(',','.') : values[i];
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${color}"/><text x="${p[0].toFixed(1)}" y="${labelY}" font-size="9" text-anchor="middle" fill="#2B2B2B">${valTxt}</text><text x="${p[0].toFixed(1)}" y="${h-1}" font-size="8.5" text-anchor="middle" fill="#9A9A9A">${labels[i]}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="140">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.3"/>
    ${dots}
  </svg>`;
}

function renderDivisional(){
  let h = `<h3 class="section-title" style="font-size:15px;color:${COLORS.turquesa};">Tarjetas Verdes (TV)</h3><div class="stats-row">`;
  DIVISIONAL.stats.forEach(([v,l],i)=>{
    const cols=[COLORS.turquesa,COLORS.naranja,COLORS.amarillo,COLORS.cobre];
    h += `<div class="stat-card"><div class="v" style="color:${cols[i]}">${v}</div><div class="l">${l}</div></div>`;
  });
  h += `</div><div class="grid2">
    <div><h3 class="section-title">Tendencia mensual (división)</h3>${sparklineSvg(DIVISIONAL.monthly, COLORS.turquesa)}</div>
    <div><h3 class="section-title">RF con más TV en el año — Top 8</h3>${barsHtml(DIVISIONAL.topRF, DIVISIONAL.topRF[DIVISIONAL.topRF.length-1][1])}</div>
  </div>
  <div class="ytd-band"><div class="txt">${esc(DIVISIONAL.note)}</div></div>`;

  h += `<h3 class="section-title" style="font-size:15px;color:${COLORS.naranja};margin-top:26px;">Reportes de Peligro (RP)</h3><div class="stats-row">`;
  DIVISIONAL_RP.stats.forEach(([v,l],i)=>{
    const cols=[COLORS.naranja,COLORS.turquesa,COLORS.cobre,COLORS.amarillo];
    h += `<div class="stat-card"><div class="v" style="color:${cols[i]}">${v}</div><div class="l">${l}</div></div>`;
  });
  h += `</div><div class="grid2">
    <div><h3 class="section-title">Tendencia mensual RP (división)</h3>${sparklineSvg(DIVISIONAL_RP.monthly, COLORS.naranja)}</div>
    <div><h3 class="section-title">RF con más RP en el año — Top 8</h3>${barsHtml(DIVISIONAL_RP.topRF, DIVISIONAL_RP.topRF[DIVISIONAL_RP.topRF.length-1][1])}</div>
  </div>
  <div class="ytd-band"><div class="txt">${esc(DIVISIONAL_RP.note)}</div></div>`;
  return h;
}

function renderGerencia(g){
  let h = `<div class="kicker" style="margin-bottom:2px;">${esc(g.code)} · ${esc(g.kicker)}</div>
  <h2 style="margin:0 0 16px;font-size:20px;">${esc(g.key)}</h2>
  <div class="stats-row">`;
  g.stats.forEach(([v,l,c])=>{
    h += `<div class="stat-card"><div class="v" style="color:${COLORS[c]}">${v}</div><div class="l">${l}</div></div>`;
  });
  if(g.rp_total!=null){
    h += `<div class="stat-card"><div class="v" style="color:${COLORS.turquesa}">${g.rp_total}</div><div class="l">Reportes de Peligro (RP)<br>en el mismo período</div></div>`;
  }
  h += `</div><div class="grid3">`;

  h += `<div><h3 class="section-title">RF principal por área — TV vs RP (clic en fila para ver TV)</h3>
    <table class="datatable"><thead><tr><th>Área</th><th>TV</th><th>RF ppal. TV</th><th>RP</th><th>RF ppal. RP</th></tr></thead><tbody>`;
  g.areas.forEach(a => {
    const uid = "d"+(uidCounter++);
    h += `<tr class="clickable" data-uid="${uid}" data-ger="${esc(g.key)}" data-sup="${esc(a.sup)}"><td>${esc(a.area)}</td><td>${a.tv}</td><td>${esc(a.rf)} ${a.pct && a.pct!=='—' ? `<span class="pct">(${a.pct})</span>` : ''}</td><td>${a.rp_tv!=null?a.rp_tv:'—'}</td><td>${esc(a.rp_rf||'—')} ${a.rp_pct?`<span class="pct">(${a.rp_pct})</span>`:''}</td></tr>`;
  });
  h += `</tbody></table><div class="count-badge" style="margin-top:6px;">RP: Reportes de Peligro, otra herramienta preventiva. Total del período en esta gerencia: ${g.rp_total!=null?g.rp_total:'—'}.</div><div id="area-detail-${esc(g.key)}"></div></div>`;

  h += `<div><h3 class="section-title">Reportabilidad mensual (TV, 2026)</h3>${sparklineSvg(g.monthly, COLORS.turquesa)}`;
  const alertas = g.patrones.filter(p => p.titulo && p.titulo.indexOf("⚠") === 0);
  alertas.forEach(p => {
    const uid = "p"+(uidCounter++);
    const uidRp = "p"+(uidCounter++);
    h += `<div class="alert-box"><div class="alert-lbl"><span class="ico">!</span>Foco Principal de Gestión de Riesgos</div><div class="ttl">${esc(p.titulo.replace("⚠","").trim())}</div><div class="txt">${esc(p.text)}</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">`;
    if(p.key){ h += `<button class="reveal" onclick="onPatternClick('${p.key}','${uid}')">Ver TV asociadas</button>`; }
    if(p.rpkey){ h += `<button class="reveal reveal-rp" onclick="onPatternClickRp('${p.rpkey}','${uidRp}')">Ver RP asociados</button>`; }
    h += `</div>`;
    if(p.key){ h += `<div class="detail-box" id="${uid}"></div>`; }
    if(p.rpkey){ h += `<div class="detail-box" id="${uidRp}"></div>`; }
    h += `</div>`;
  });
  h += `</div>`;

  h += `<div><h3 class="section-title">Patrones detectados en la descripción</h3>`;
  const patronesNormales = g.patrones.filter(p => !(p.titulo && p.titulo.indexOf("⚠") === 0));
  patronesNormales.forEach(p => {
    const uid = "p"+(uidCounter++);
    const uidRp = "p"+(uidCounter++);
    h += `<div class="pattern-card">${p.titulo ? `<div class="ttl">${esc(p.titulo)}</div>` : ""}<div class="txt">${esc(p.text)}</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">`;
    if(p.key){
      h += `<button class="reveal" onclick="onPatternClick('${p.key}','${uid}')">Ver TV asociadas</button>`;
    }
    if(p.rpkey){
      h += `<button class="reveal reveal-rp" onclick="onPatternClickRp('${p.rpkey}','${uidRp}')">Ver RP asociados</button>`;
    }
    h += `</div>`;
    if(p.key){ h += `<div class="detail-box" id="${uid}"></div>`; }
    if(p.rpkey){ h += `<div class="detail-box" id="${uidRp}"></div>`; }
    h += `</div>`;
  });
  h += `</div></div>`;

  h += `<div class="ytd-band"><div class="lbl">Cómo vamos en el año</div><div class="txt">${esc(g.ytd)}</div></div>`;

  h += `<h3 class="section-title">Recomendaciones</h3>`;
  g.recomendaciones.forEach((r,i) => {
    h += `<div class="reco"><div class="num">${i+1}</div><div>${esc(r)}</div></div>`;
  });

  return h;
}

function onPatternClick(key, uid){
  const ids = [...new Set(PATTERNS[key] || [])];
  const rows = [];
  ids.forEach(id => (byId[id]||[]).forEach(r=>rows.push(r)));
  toggleDetail(uid, rows, false);
}

function onPatternClickRp(key, uid){
  const ids = [...new Set(RP_PATTERNS[key] || [])];
  const rows = [];
  ids.forEach(id => (byIdRp[id]||[]).forEach(r=>rows.push(r)));
  toggleDetail(uid, rows, true);
}

document.addEventListener("click", function(e){
  const tr = e.target.closest("tr.clickable[data-uid]");
  if(!tr) return;
  const ger = tr.getAttribute("data-ger"), sup = tr.getAttribute("data-sup");
  const rows = TV_DATA.filter(r => r.gerencia===ger && r.superintendencia===sup);
  const container = document.getElementById("area-detail-"+ger);
  if(container.dataset.openUid === tr.dataset.uid){
    container.innerHTML = ""; container.dataset.openUid = "";
  } else {
    container.innerHTML = renderDetailTable(rows);
    container.dataset.openUid = tr.dataset.uid;
  }
});

function renderExplorer(){
  const gerencias = [...new Set(TV_DATA.map(r=>r.gerencia))].sort();
  const rfs = [...new Set(TV_DATA.map(r=>r.rf_code+" "+r.rf_nombre))].sort();
  const estatus = [...new Set(TV_DATA.map(r=>r.estatus_tv))].sort();
  let h = `<div class="explore-filters">
    <select id="f-ger"><option value="">Todas las gerencias</option>${gerencias.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("")}</select>
    <select id="f-rf"><option value="">Todos los RF</option>${rfs.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select>
    <select id="f-estatus"><option value="">Todos los estatus</option>${estatus.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
    <input type="text" id="f-text" placeholder="Buscar por ID, empresa, descripción... (ej: joyglobal, licencia, 20443)">
  </div>
  <div id="explore-results"></div>`;
  return h;
}

function applyExploreFilters(){
  const ger = document.getElementById("f-ger").value;
  const rf = document.getElementById("f-rf").value;
  const est = document.getElementById("f-estatus").value;
  const txt = document.getElementById("f-text").value.trim().toLowerCase();
  let rows = TV_DATA.filter(r => {
    if(ger && r.gerencia!==ger) return false;
    if(rf && (r.rf_code+" "+r.rf_nombre)!==rf) return false;
    if(est && r.estatus_tv!==est) return false;
    if(txt){
      const hay = (r.id+" "+r.empresa+" "+r.descripcion+" "+r.superintendencia).toLowerCase();
      if(!hay.includes(txt)) return false;
    }
    return true;
  });
  rows = rows.slice(0, 300);
  document.getElementById("explore-results").innerHTML = renderDetailTable(rows) + (rows.length===300 ? `<div class="count-badge">Mostrando primeras 300 filas — afina el filtro para ver más específico.</div>` : "");
}

const TABS = [{id:"div", label:"Visión Divisional"}]
  .concat(GERENCIAS.map((g,i)=>({id:"g"+i, label:g.code})))
  .concat([{id:"explore", label:"Explorar todas las TV"}]);

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map((t,i)=>`<button data-tab="${t.id}" class="${i===0?'active':''}">${esc(t.label)}</button>`).join("");
  nav.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", () => showTab(btn.getAttribute("data-tab")));
  });
}

function showTab(id){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.getAttribute("data-tab")===id));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id==="panel-"+id));
}

function renderAll(){
  renderTabs();
  const main = document.getElementById("main");
  let h = `<div class="panel active" id="panel-div">${renderDivisional()}</div>`;
  GERENCIAS.forEach((g,i) => {
    h += `<div class="panel" id="panel-g${i}">${renderGerencia(g)}</div>`;
  });
  h += `<div class="panel" id="panel-explore">${renderExplorer()}</div>`;
  h += `<div class="footer-note">Fuente: Tarjetas Verdes con Acciones Correctivas y Reportes de Peligro, últimos 15 días. Cada fila de las tablas de detalle corresponde a una Tarjeta Verde × Acción Correctiva: una misma TV puede aparecer varias veces si tiene más de una AC asociada (columna "ID AC"). Noviembre es un mes parcial en las series mensuales.</div>`;
  main.innerHTML = h;
  ["f-ger","f-rf","f-estatus"].forEach(id => document.getElementById(id).addEventListener("change", applyExploreFilters));
  document.getElementById("f-text").addEventListener("input", applyExploreFilters);
  applyExploreFilters();
}

renderAll();
</script>
